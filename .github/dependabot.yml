version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # v10 rewrote its templates to a function-based API that's incompatible with
      # @semantic-release/release-notes-generator's Handlebars-partial rendering pipeline
      # (silently produces empty changelog bodies). See ADR #11.
      - dependency-name: 'conventional-changelog-conventionalcommits'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
    groups:
      github-actions:
        update-types:
          - 'minor'
          - 'patch'
