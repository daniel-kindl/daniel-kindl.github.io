name: Production Deployment

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966 # post-v7.0.0 security fix
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Generate Programmatic Assets
        run: npm run generate-assets

      - name: Execute Lint Verification
        run: npm run lint

      - name: Execute Format Verification
        run: npm run format:check

      - name: Execute Type Verification
        run: npm run typecheck

      - name: Execute Test Suite
        run: npm test

      - name: Compile Production Artifacts
        run: npm run build

      - name: Execute Lighthouse Performance Budget
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './lighthouserc.json'

      - name: Run Release Automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      # buildInfo.ts reads the version from package.json. The release step writes
      # the next version only after all gates pass, so rebuild before publishing.
      - name: Recompile With Released Version
        run: npm run build

      - name: Setup Pages Architecture
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Static Package
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

      - name: Deploy to GitHub Pages Target
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
